name: Execution build and tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pending: unpublished toolkit SHA cannot be fetched by remote runners until
# authorized toolkit publication and pin replacement. Local overrides are not CI.
jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: set-matrix
        run: echo "matrix=$(cat .github/matrix.json | python3 scripts/flatten_json.py)" >> $GITHUB_OUTPUT

  builds:
    needs: generate-matrix
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Emscripten SDK
        if: ${{ matrix.config.compiler == 'emscripten' }}
        shell: bash
        run: |
          git init "$HOME/emsdk"
          git -C "$HOME/emsdk" fetch --depth 1 https://github.com/emscripten-core/emsdk.git a2b92777574c2feda07994cd4f1079a3dfc151f8 # 6.0.10
          git -C "$HOME/emsdk" checkout --detach FETCH_HEAD
          pushd "$HOME/emsdk"
          ./emsdk install 6.0.10
          ./emsdk activate 6.0.10
          echo 'source "$HOME/emsdk/emsdk_env.sh"' >> "$HOME/.bash_profile"
          popd
      - name: Qt6
        if: ${{ matrix.config.qt == 'qt6' }}
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev
      - name: Qt5
        if: ${{ matrix.config.qt == 'qt5' }}
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev
      - name: GCC environment
        if: ${{ matrix.config.compiler == 'gcc' }}
        shell: bash
        run: |
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
      - name: Clang environment
        if: ${{ matrix.config.compiler == 'clang' }}
        shell: bash
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
      - name: MSVC x64
        if: ${{ startsWith(matrix.config.os, 'windows') }}
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64
      - name: Configure native
        if: ${{ matrix.config.compiler != 'emscripten' }}
        run: cmake --preset=${{ matrix.config.preset }} ${{ matrix.config.cmake_options }}
      - name: Configure Emscripten
        if: ${{ matrix.config.compiler == 'emscripten' }}
        shell: bash -l {0}
        run: cmake --preset=${{ matrix.config.preset }}
      - name: Build
        if: ${{ matrix.config.compiler != 'emscripten' }}
        run: cmake --build --preset=${{ matrix.config.preset }}
      - name: Build Emscripten
        if: ${{ matrix.config.compiler == 'emscripten' }}
        shell: bash -l {0}
        run: cmake --build --preset=${{ matrix.config.preset }}
      - name: Test
        if: ${{ matrix.config.compiler != 'emscripten' }}
        run: ctest --preset=${{ matrix.config.preset }} --verbose
      - name: Test Emscripten
        if: ${{ matrix.config.compiler == 'emscripten' }}
        shell: bash -l {0}
        run: ctest --preset=${{ matrix.config.preset }} --verbose

  macos-sanitizers:
    name: macOS TSan+UBSan (${{ matrix.preset }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [test-sanitizer, test-portable-sanitizer]
    steps:
      - uses: actions/checkout@v6
      - run: cmake --preset=${{ matrix.preset }}
      - run: cmake --build --preset=${{ matrix.preset }}
      - run: ctest --preset=${{ matrix.preset }} --verbose

  packages:
    name: Installed consumers (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: test-packages
          - os: macos-latest
            preset: test-packages
          - os: macos-latest
            preset: test-packages-shared
          - os: windows-latest
            preset: test-packages
          - os: windows-latest
            preset: test-packages-shared
          - os: windows-latest
            preset: test-packages-portable-shared
    steps:
      - uses: actions/checkout@v6
      - if: ${{ startsWith(matrix.os, 'windows') }}
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: x64
      - run: cmake --preset=${{ matrix.preset }}
      - run: ctest --preset=${{ matrix.preset }}

  clang-tidy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Configure CMake with clang-tidy
        run: cmake --preset=clang-tidy

      - name: Build with clang-tidy
        run: cmake --build --preset=clang-tidy

      - name: Run tests with clang-tidy
        run: ctest --preset=clang-tidy

  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Doxygen
        uses: ssciwr/doxygen-install@329d88f5a303066a5bd006db7516b1925b86350e

      - name: Configure CMake
        run: cmake --preset=docs

      - name: Build Documentation
        run: cmake --build --preset=docs

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v7
        with:
          name: execution-doxygen-html
          path: build/docs/html
